spring.application.name=offboarding

# Database URL - format is jdbc:mysql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:mysql://localhost:3306/offboarding

# MySQL Credentials
spring.datasource.username=root
spring.datasource.password=myroot

# MySQL Driver Class (Optional in newer Spring Boot versions as it's auto-detected)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# security.jwt.private-key=classpath:keys/private.pem
# security.jwt.public-key=classpath:keys/public.pem
# 1h in millisecond
security.jwt.expiration-time=3600000

logging.level.root=WARN
logging.level.mx.izzi.offboarding=TRACE
logging.level.org.springframework.security=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.http.converter=TRACE
logging.level.org.springframework.http.converter.json=TRACE
logging.level.com.fasterxml.jackson.databind=TRACE
spring.mvc.log-request-details=true


